<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Buns &amp; Guns</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0A0C">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A0C;--line:#2B2330;--tx:#FFF3E8;--mu:#A2919C;--red:#FF2D3F;
  --disp:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:16px;line-height:1.6;
  display:grid;place-items:center;padding:32px 16px;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:460px}
img{width:132px;height:auto;border-radius:18px;border:1px solid var(--line);display:block;margin:0 auto 32px}
.kicker{margin:0 0 14px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(32px,7vw,48px);line-height:1.05;letter-spacing:-.02em;margin:0}
p.lede{margin:18px 0 32px;color:var(--mu)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{color:inherit;text-decoration:none}
.tb{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;padding:14px 26px;border-radius:999px;font-size:14px;font-weight:800;letter-spacing:.01em}
.tb.out{background:none;border:1px solid var(--line);color:var(--tx)}
.tb:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/logo.jpg" alt="Buns and Guns logo" width="303" height="292">
  <p class="kicker">Error 404</p>
  <h1>This page got eaten.</h1>
  <p class="lede">The link may be old or mistyped. The burgers are still where they always were.</p>
  <div class="btns">
    <a class="tb" href="/">Back to Buns &amp; Guns</a>
    <a class="tb out" href="tel:+35799403810">Call 99 403810</a>
  </div>
</main>
</body>
</html>
