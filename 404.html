<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Buns &amp; Guns</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#110D0C">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Unbounded";src:url("/fonts/unbounded-latin-v1.woff2") format("woff2");font-weight:700 900;font-display:swap}
@font-face{font-family:"BG Display Greek";src:url("/fonts/bg-display-greek-v1.woff2") format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0370-03FF}
@font-face{font-family:"Inter";src:url("/fonts/inter-latin-v1.woff2") format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"Inter";src:url("/fonts/inter-greek-v1.woff2") format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0370-03FF}
:root{--bg:#110D0C;--line:#35271F;--tx:#FFF3E8;--mu:#B9A396;--red-ui:#E3202F;
  --disp:"Unbounded","BG Display Greek",system-ui,sans-serif;--ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:16px;line-height:1.6;
  display:grid;place-items:center;padding:32px 20px;text-align:center;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(520px 420px at 50% 30%,rgba(255,45,63,.16),rgba(255,45,63,0) 70%)}
main{max-width:480px}
img{width:132px;height:auto;border-radius:18px;border:1px solid var(--line);display:block;margin:0 auto 32px}
.kicker{margin:0 0 14px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#E8B9A0}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0}
p.lede{margin:18px 0 32px;color:var(--mu)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{color:inherit;text-decoration:none}
.tb{display:inline-flex;align-items:center;justify-content:center;background:var(--red-ui);color:#fff;padding:14px 26px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.01em}
.tb.out{background:none;border:1px solid var(--line);color:var(--tx)}
.tb:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/logo.jpg" alt="Buns and Guns logo" width="303" height="292" id="logo">
  <p class="kicker" id="k">Error 404</p>
  <h1 id="h">This page got eaten.</h1>
  <p class="lede" id="l">The link may be old or mistyped. The burgers are still where they always were.</p>
  <div class="btns">
    <a class="tb" href="/" id="home">Back to Buns &amp; Guns</a>
    <a class="tb out" href="tel:+35799403810" id="call">Call 99 403810</a>
  </div>
</main>
<script>
/* in Greek for whoever reads the site in Greek: their last choice, or a phone set to Greek */
(function(){
  var l=null;try{var q=new URLSearchParams(location.search).get('lang');l=q?(/^(el|gr)/i.test(q)?'gr':'en'):localStorage.getItem('bg-lang')}catch(e){}
  if(l!=='gr'&&l!=='en')l=/^el\b/i.test(navigator.language||'')?'gr':'en';
  if(l!=='gr')return;
  document.documentElement.lang='el';
  document.title='Η σελίδα δεν βρέθηκε · Buns & Guns';
  var t={logo:['alt','Λογότυπο Buns and Guns'],k:'Σφαλμα 404'/* set in capitals: no accent */,h:'Αυτή η σελίδα φαγώθηκε.',l:'Ο σύνδεσμος μπορεί να είναι παλιός ή γραμμένος λάθος. Τα μπέργκερ είναι εκεί που ήταν πάντα.',home:'Πίσω στο Buns & Guns',call:'Κλήση 99 403810'};
  for(var id in t){var el=document.getElementById(id);if(!el)continue;if(Array.isArray(t[id]))el.setAttribute(t[id][0],t[id][1]);else el.textContent=t[id]}
  document.getElementById('home').href='/?lang=el';
})();
</script>
</body>
</html>
